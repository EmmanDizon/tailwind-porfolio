              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"

                class="font-semibold uppercase text-sm text-indigo-900 hover:text-indigo-400 hover:transition-colors dark:text-indigo-400 hover:dark:text-indigo-200"
